[package]
name = "charlie-launchlab"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "Charlie Protocol's LaunchLab rail: stock-paired launches with all four legs. LAUNCHLAB-RAIL.md is the design."
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "charlie_launchlab"

[features]
no-entrypoint = []
devnet = []

[dependencies]
solana-program = "2.1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = true

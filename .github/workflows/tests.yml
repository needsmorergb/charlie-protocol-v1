# The suite, run.
#
# The whole suite lived in this repository and nothing ran it anywhere but a
# laptop. Two consequences, both real rather than hypothetical:
#
#   * `tests/test_enroll_page_js.py` executes the enrol page's JavaScript
#     under node, and skips when node is absent. On a machine without node
#     that file reports success having tested nothing.
#   * The deploy repository had drifted from this one in two files, and the
#     drift went unnoticed for as long as nobody happened to diff them.
#
# So node is installed and CHARLIE_REQUIRE_NODE makes its absence a failure,
# and the deployed copies are compared against these ones on every push.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No install step. Standard library only, on purpose.

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: The suite
        env:
          # Without this a missing node makes the page-script tests skip, and
          # a green run would mean the page's branching was never executed.
          CHARLIE_REQUIRE_NODE: "1"
        run: python -m unittest discover -s tests -v

      # The deployed copies of the shared modules, compared against these
      # ones. Same branch where the deploy repository has it, main otherwise:
      # a branch here that has not been mirrored there yet is not drift.
      - name: Is the deployed copy the same code
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          probe="https://raw.githubusercontent.com/needsmorergb/charlie-protocol-site/${branch}/indexer/site.py"
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "$probe")" != "200" ]; then
            echo "no ${branch} on the deploy repository; comparing against main"
            branch=main
          fi
          python tools/shared_sync.py --against-branch "$branch"
